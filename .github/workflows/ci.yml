name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run mypy
      - run: uv run python -m ruff check .
      - run: uv run python -m ruff format --check .
      - run: uv build
      - run: uv run python scripts/smoke_artifacts.py
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra gateway
      - run: uv run --no-sync python scripts/smoke_gateway.py
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: uv sync --locked --extra kubernetes
      - run: uv run --no-sync python scripts/smoke_kubernetes.py
