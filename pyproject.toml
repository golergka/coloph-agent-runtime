[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "coloph-agent-runtime"
version = "0.1.0"
description = "Typed headless Claude Code execution with events, sessions, and explicit process ownership."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "golergka"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Typing :: Typed", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
gateway = ["httpx>=0.28,<1", "pyyaml>=6,<7", "starlette>=1.0.1,<2", "uvicorn>=0.41,<1", "litellm[proxy]>=1.89,<2"]

[project.urls]
Repository = "https://github.com/golergka/coloph-agent-runtime"
Issues = "https://github.com/golergka/coloph-agent-runtime/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "httpx>=0.28,<1", "pyyaml>=6,<7", "types-pyyaml>=6,<7", "starlette>=1.0.1,<2", "uvicorn>=0.41,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/coloph_agent_runtime"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
files = ["src/coloph_agent_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "-ra"
